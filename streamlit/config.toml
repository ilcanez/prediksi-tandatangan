# Streamlit Configuration
# .streamlit/config.toml

[theme]
# Primary color (BSI Blue)
primaryColor = "#3B82F6"

# Background color
backgroundColor = "#FFFFFF"

# Secondary background color
secondaryBackgroundColor = "#F3F4F6"

# Text color
textColor = "#1F2937"

# Font
font = "sans serif"

[server]
# Port
port = 8501

# Enable CORS
enableCORS = false

# Enable XSRF protection
enableXsrfProtection = true

# Max upload size (200 MB)
maxUploadSize = 200

# Enable websocket compression
enableWebsocketCompression = true

[browser]
# Gather usage stats
gatherUsageStats = false

# Server address
serverAddress = "localhost"

# Server port
serverPort = 8501

[runner]
# Magic commands
magicEnabled = true

# Install Tracer
installTracer = false

# Fix Matplotlib
fixMatplotlib = true

# Post script gc
postScriptGC = true

[client]
# Show error details
showErrorDetails = true

# Toolbar mode
toolbarMode = "auto"

[logger]
# Log level
level = "info"

# Message format
messageFormat = "%(asctime)s %(message)s"
